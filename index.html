<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,700;1,200;1,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/records.css" />
    <link rel="stylesheet" href="css/modal.css" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="main.js" defer></script>
    <title>CRUD</title>
  </head>

  <body>
    <header>
      <h1 class="header-title">Cadastro de Clientes</h1>
    </header>
    <main>
      <button type="button" class="button blue mobile" id="cadastrarCliente">
        Cadastrar Cliente
      </button>
      <div class="toolbar">
        <input
          type="text"
          id="busca"
          class="modal-field"
          placeholder="Buscar cliente..."
        />
        <div class="toolbar-actions">
          <button type="button" class="button blue" id="exportarCsv">
            Exportar CSV
          </button>
          <button type="button" class="button blue" id="exportarBackup">
            Exportar JSON
          </button>
          <button type="button" class="button blue" id="importarBackup">
            Importar JSON
          </button>
          <input
            type="file"
            id="arquivoBackup"
            accept=".json,application/json"
            hidden
          />
        </div>
      </div>
      <p id="contador" class="records-info"></p>
      <table id="tableClient" class="records">
        <thead>
          <tr>
            <th data-field="nome">Nome</th>
            <th data-field="email">E-mail</th>
            <th data-field="celular">Celular</th>
            <th data-field="cidade">Cidade</th>
            <th data-field="estado">Estado</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty-state" id="vazio" hidden></div>
      <nav class="pagination" id="paginacao" hidden>
        <button type="button" class="button blue" id="paginaAnterior">
          Anterior
        </button>
        <span class="pagination-info" id="paginaInfo"></span>
        <button type="button" class="button blue" id="paginaProxima">
          Próxima
        </button>
      </nav>
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
          <header class="modal-header">
            <h2 id="modalTitle">Novo Cliente</h2>
            <span class="modal-close" id="modalClose" role="button" aria-label="Fechar">&#10006;</span>
          </header>
          <form id="form" class="modal-form">
            <input
              type="text"
              id="nome"
              data-id="new"
              class="modal-field"
              placeholder="Nome do Cliente"
              required
            />
            <input
              type="email"
              id="email"
              class="modal-field"
              placeholder="e-mail do Cliente"
              required
            />
            <input
              type="text"
              id="celular"
              class="modal-field"
              placeholder="Celular do Cliente"
              pattern="\(\d{2}\) \d{5}-\d{4}"
              title="Use o formato (11) 99999-8888"
              required
            />
            <input
              type="text"
              id="cidade"
              class="modal-field"
              placeholder="Cidade do Cliente"
              required
            />
            <select id="estado" class="modal-field" required>
              <option value="">Estado</option>
              <option value="AC">AC</option>
              <option value="AL">AL</option>
              <option value="AP">AP</option>
              <option value="AM">AM</option>
              <option value="BA">BA</option>
              <option value="CE">CE</option>
              <option value="DF">DF</option>
              <option value="ES">ES</option>
              <option value="GO">GO</option>
              <option value="MA">MA</option>
              <option value="MT">MT</option>
              <option value="MS">MS</option>
              <option value="MG">MG</option>
              <option value="PA">PA</option>
              <option value="PB">PB</option>
              <option value="PR">PR</option>
              <option value="PE">PE</option>
              <option value="PI">PI</option>
              <option value="RJ">RJ</option>
              <option value="RN">RN</option>
              <option value="RS">RS</option>
              <option value="RO">RO</option>
              <option value="RR">RR</option>
              <option value="SC">SC</option>
              <option value="SP">SP</option>
              <option value="SE">SE</option>
              <option value="TO">TO</option>
            </select>
          </form>
          <footer class="modal-footer">
            <button id="salvar" class="button green">Salvar</button>
            <button id="cancelar" class="button blue">Cancelar</button>
          </footer>
        </div>
      </div>
    </main>
    <footer>
      Layout base: Prof. Fernando Leonid &middot; Desenvolvido por Gilvam
      Oliveira
    </footer>
  </body>
</html>
